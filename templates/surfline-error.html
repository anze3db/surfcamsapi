{% if message %}
    <div>{{ message }}</div>
{% elif give_up %}
    <div>
        Surfline API is still down 😓
        <a href="#"
           hx-get="{% url 'surfline_detail' cam.id %}"
           hx-target="closest div"
           hx-swap="outerHTML">Try again</a>
    </div>
{% else %}
    <div hx-get="{% url 'surfline_detail' cam.id %}?attempt={{ next_attempt }}"
         hx-trigger="load delay:{{ retry_delay }}s"
         hx-swap="outerHTML"
         aria-busy="true">Surfline API wiped out 😓 Retrying...</div>
{% endif %}
